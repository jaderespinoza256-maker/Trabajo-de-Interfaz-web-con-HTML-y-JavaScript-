<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Inventario</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
<div class="caja">
  <h1>Sistema de Inventario</h1>

  <div class="formulario">
    <div class="campo">
      <label>Nombre del producto</label>
      <input type="text" id="nombre" placeholder="Ej: Mouse">
    </div>

    <div class="campo">
      <label>Precio</label>
      <input type="number" id="precio" placeholder="Ej: 50000">
    </div>

    <div class="campo">
      <label>Cantidad</label>
      <input type="number" id="cantidad" placeholder="Ej: 3">
    </div>

    <div class="campo">
      <label>Categoría</label>
      <input type="text" id="categoria" placeholder="Ej: Tecnología">
    </div>

    <button onclick="agregarProducto()">AGREGAR PRODUCTO</button>
  </div>

  <div class="totales">
    <p>Total productos registrados: <span id="totalCantidad">0</span></p>
    <p>Valor total del inventario: $<span id="totalValor">0</span></p>
  </div>

  <table id="tabla">
    <thead>
      <tr>
        <th>Producto</th>
        <th>Precio</th>
        <th>Cantidad</th>
        <th>Valor total</th>
        <th>Acción</th>
      </tr>
    </thead>
    <tbody id="cuerpoTabla">
    </tbody>
  </table>

  <button class="volver" onclick="location.href='../index.html'">← Volver al menú</button>
</div>

<script src="script.js"></script>
</body>
</html>
