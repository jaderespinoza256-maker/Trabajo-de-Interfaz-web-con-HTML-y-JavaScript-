<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Notas</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
<div class="caja">
  <h1>Sistema de Notas</h1>

  <div class="campo">
    <label>Nombre del estudiante</label>
    <input type="text" id="nombre" placeholder="Escribe el nombre">
  </div>

  <div class="campo">
    <label>Nota 1</label>
    <input type="number" id="nota1" step="0.1" min="0" max="5" placeholder="Ej: 3.5">
  </div>

  <div class="campo">
    <label>Nota 2</label>
    <input type="number" id="nota2" step="0.1" min="0" max="5" placeholder="Ej: 4.0">
  </div>

  <div class="campo">
    <label>Nota 3</label>
    <input type="number" id="nota3" step="0.1" min="0" max="5" placeholder="Ej: 3.8">
  </div>

  <button onclick="calcularNota()">CALCULAR NOTA</button>

  <div id="resultado"></div>

  <button class="volver" onclick="location.href='../index.html'">← Volver al menú</button>
</div>

<script src="script.js"></script>
</body>
</html>
