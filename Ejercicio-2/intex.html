<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de Compra</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
<div class="caja">
  <h1>Calculadora de Compra</h1>

  <div class="campo">
    <label>Producto</label>
    <select id="producto">
      <option value="">Elige un producto</option>
      <option value="15000">Hamburguesa - $15.000</option>
      <option value="8000">Pizza - $8.000</option>
      <option value="5000">Refresco - $5.000</option>
      <option value="12000">Combo - $12.000</option>
    </select>
  </div>

  <div class="campo">
    <label>Precio</label>
    <input type="number" id="precio" placeholder="Selecciona o escribe">
  </div>

  <div class="campo">
    <label>Cantidad</label>
    <input type="number" id="cantidad" placeholder="Escribe cuántos">
  </div>

  <div class="campo">
    <label>Descuento (%)</label>
    <input type="number" id="descuento" placeholder="Si tiene">
  </div>

  <button onclick="calcular()">CALCULAR</button>

  <div id="resultado"></div>

  <button class="volver" onclick="location.href='../index.html'">← Volver al menú</button>
</div>

<script src="script.js"></script>
</body>
</html>
