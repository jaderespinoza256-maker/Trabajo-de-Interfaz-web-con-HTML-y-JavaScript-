<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Registro</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
<div class="caja">
  <div class="titulo"><div class="icono">⚙</div><h1>Formulario de Registro</h1></div>
  <div class="campo"><div class="etiqueta"><span class="et">👤</span><label>Nombre Completo</label></div><input type="text" id="nom"></div>
  <div class="campo"><div class="etiqueta"><span class="et">📅</span><label>Edad</label></div><input type="number" id="edad"></div>
  <div class="campo"><div class="etiqueta"><span class="et">✉️</span><label>Correo Electrónico</label></div><input type="email" id="correo"></div>
  <div class="campo"><div class="etiqueta"><span class="et">📍</span><label>Ciudad</label></div><input type="text" id="ciudad"></div>
  <button onclick="registrar()">REGISTRAR</button>
  <div id="res"></div>
  <button class="volver" onclick="location.href='../index.html'">← Volver al Menú</button>
</div>
<script src="script.js"></script>
</body>
</html>
